# Optional overlay for running only gridfs cases in the shared smoke stack.
services:
  prepare:
    environment:
      SMOKE_CASES: gridfs-plain,gridfs-encrypted
    depends_on: !override
      alfresco:
        condition: service_started
      mongo:
        condition: service_started
      secrets:
        condition: service_started
  smoke:
    environment:
      SMOKE_CASES: gridfs-plain,gridfs-encrypted
    depends_on: !override
      app-gridfs-plain:
        condition: service_started
      app-gridfs-encrypted:
        condition: service_started

# Optional overlay for running only the native Ozone cases in the shared smoke stack.
services:
  prepare:
    environment:
      SMOKE_CASES: ozone-plain,ozone-encrypted
    depends_on: !override
      alfresco:
        condition: service_started
      mongo:
        condition: service_started
      secrets:
        condition: service_started
      ozone-init:
        condition: service_completed_successfully
  smoke:
    environment:
      SMOKE_CASES: ozone-plain,ozone-encrypted
    depends_on: !override
      app-ozone-plain:
        condition: service_started
      app-ozone-encrypted:
        condition: service_started

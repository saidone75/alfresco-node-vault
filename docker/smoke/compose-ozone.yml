# Requires Docker Compose 2.24.4+. Native RPC only; no host ports or external volumes.
name: anv-smoke-ozone

x-runner: &runner
  image: babashka/babashka:1.12.213
  entrypoint: ["bb", "/smoke/smoke.clj"]
  volumes:
    - ./smoke.clj:/smoke/smoke.clj:ro
    - ../../src/test/resources/sample.pdf:/smoke/sample.pdf:ro
    - reports:/reports
  environment: &runner-env
    SMOKE_WAIT_SECONDS: ${SMOKE_WAIT_SECONDS:-900}
    SMOKE_CASES: ozone-plain,ozone-encrypted

x-app: &app
  image: anv-smoke:local
  build:
    context: ../..
    dockerfile: docker/Dockerfile.vault
  mem_limit: 768m
  depends_on:
    prepare:
      condition: service_completed_successfully
  environment: &app-env
    ALFRESCO_BASE_PATH: http://alfresco:8080
    ACTIVE_MQ_URL: tcp://activemq:61616
    MONGODB_URL: mongodb://mongo:27017
    VAULT_URL: http://secrets:8200
    VAULT_ENCRYPTION_SECRET_PATH: AlfrescoNodeVaultSmoke
    VAULT_STORAGE_IMPL: ozone
    OZONE_OM_ADDRESS: ozone-om:9862
    OZONE_VOLUME: smoke
    ARCHIVING_JOB_ENABLED: "false"
    EVENT_HANDLER_ENABLED: "false"
    NOTARIZATION_ENABLED: "false"
    NOTARIZATION_JOB_ENABLED: "false"
    INTEGRITY_SWEEP_ENABLED: "false"
    VAULT_DOUBLE_CHECK: "true"
    VAULT_DELETE_ON_ALFRESCO: "true"
    VAULT_DELETE_NODE_API_ENABLED: "true"
    VAULT_DELETE_NODE_RESTORE_ON_ALFRESCO: "false"
    VAULT_DELETE_NODE_DELETE_ON_ALFRESCO: "false"

services:
  alfresco:
    extends:
      file: compose.yml
      service: alfresco
    container_name: anv-smoke-ozone-alfresco

  postgres:
    extends:
      file: compose.yml
      service: postgres
    container_name: anv-smoke-ozone-postgres

  solr6:
    extends:
      file: compose.yml
      service: solr6
    container_name: anv-smoke-ozone-solr6

  activemq:
    extends:
      file: compose.yml
      service: activemq
    container_name: anv-smoke-ozone-activemq

  mongo:
    extends:
      file: compose.yml
      service: mongo
    container_name: anv-smoke-ozone-mongo

  secrets:
    extends:
      file: compose.yml
      service: secrets
    container_name: anv-smoke-ozone-secrets

  ozone-scm:
    extends:
      file: ../ozone/docker-compose.yml
      service: ozone-scm

  ozone-om:
    extends:
      file: ../ozone/docker-compose.yml
      service: ozone-om

  ozone-datanode:
    extends:
      file: ../ozone/docker-compose.yml
      service: ozone-datanode

  ozone-init:
    extends:
      file: ../ozone/docker-compose.yml
      service: ozone-init
    volumes: !override
      - ../ozone/initialize.sh:/init/initialize.sh:ro
    environment:
      OZONE_VOLUME: smoke
      OZONE_BUCKETS: ozone-plain ozone-encrypted

  prepare:
    <<: *runner
    command: ["prepare"]
    depends_on:
      alfresco:
        condition: service_started
      mongo:
        condition: service_started
      secrets:
        condition: service_started
      ozone-init:
        condition: service_completed_successfully

  app-ozone-plain:
    <<: *app
    environment:
      <<: *app-env
      OZONE_BUCKET: ozone-plain
      SPRING_DATA_MONGODB_DATABASE: smoke_ozone_plain
      VAULT_ENCRYPT_CONTENT: "false"
      VAULT_ENCRYPT_METADATA: "false"

  app-ozone-encrypted:
    <<: *app
    environment:
      <<: *app-env
      OZONE_BUCKET: ozone-encrypted
      SPRING_DATA_MONGODB_DATABASE: smoke_ozone_encrypted
      VAULT_ENCRYPT_CONTENT: "true"
      VAULT_ENCRYPT_METADATA: "true"

  smoke:
    <<: *runner
    environment:
      <<: *runner-env
      SMOKE_LARGE_FILE_MB: ${SMOKE_LARGE_FILE_MB:-8}
    depends_on:
      app-ozone-plain:
        condition: service_started
      app-ozone-encrypted:
        condition: service_started

volumes:
  acs:
  postgres:
  solr:
  mongo:
  reports:
  ozone-scm:
  ozone-om:
  ozone-data:
